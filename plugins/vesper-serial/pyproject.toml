[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-serial"
version = "0.1.0"
description = "Serial port plugin for Vesper — list, open, stream and write serial devices via pyserial"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dannel D. Ramos", email = "danneldavidr@gmail.com" }]
maintainers = [{ name = "Dannel D. Ramos", email = "danneldavidr@gmail.com" }]
license = "MIT"
keywords = ["vesper", "serial-port", "pyserial", "iot", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

dependencies = [
  "vesper-desktop>=0.1.0",
  "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/DannelCu/vesper"
Repository = "https://github.com/DannelCu/vesper"
Documentation = "https://github.com/DannelCu/vesper/tree/main/plugins/vesper-serial#readme"
Issues = "https://github.com/DannelCu/vesper/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vesper_serial*"]

[tool.setuptools.package-data]
vesper_serial = ["sdk/*.js"]
